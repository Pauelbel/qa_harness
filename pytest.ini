[pytest]
# Корень репозитория в sys.path: import config, clients, checks работают из любого теста.
pythonpath = .
# python -m pytest без пути — тесты самого harness (стенды не нужны); примеры: python -m pytest examples
testpaths = tests
addopts = -ra --strict-markers
markers =
    api: тесты HTTP API
    db: тесты базы данных
    ui: тесты в браузере
    dq: проверки качества данных Excel-отчётов
filterwarnings =
    # Клиенты с verify=False (тестовые HTTPS-сертификаты) не засоряют вывод.
    ignore::urllib3.exceptions.InsecureRequestWarning

# Логи: консоль — INFO, файл artifacts/<запуск>/pytest.log — DEBUG (путь задаёт conftest.py).
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)s %(message)s
log_cli_date_format = %H:%M:%S
log_file_level = DEBUG
log_file_format = %(asctime)s %(levelname)s %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
