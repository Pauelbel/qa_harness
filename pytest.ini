[pytest]
# ------------------------------------------------------------------------
# Импорты: корень проекта в sys.path — пакет qa и тесты
# ------------------------------------------------------------------------
pythonpath = .
# ------------------------------------------------------------------------
# Сборка: единственный набор тестов-примеров находится в tests/
# Маркеры api, db, ui, dq регистрирует qa/hooks/common.py и ставит по папке теста
# ------------------------------------------------------------------------
testpaths = tests
norecursedirs = .* venv build dist node_modules artifacts
addopts = -ra --strict-markers

# ------------------------------------------------------------------------
# Логи: консоль — INFO, файл — DEBUG; путь файла в папке запуска задаёт qa/hooks/common.py
# ------------------------------------------------------------------------
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)s %(message)s
log_cli_date_format = %H:%M:%S
log_file_level = DEBUG
log_file_format = %(asctime)s %(levelname)s %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
