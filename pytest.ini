[pytest]
# ------------------------------------------------------------------------
# Импорты: корень репозитория добавляется в sys.path для всех тестов
# ------------------------------------------------------------------------
pythonpath = .
# ------------------------------------------------------------------------
# Сборка: без пути — тесты Harness; примеры запускаются через pytest examples
# ------------------------------------------------------------------------
testpaths = tests
addopts = -ra --strict-markers
# ------------------------------------------------------------------------
# Маркеры: назначаются по папке теста, выбираются через pytest -m
# ------------------------------------------------------------------------
markers =
    api: тесты HTTP API
    db: тесты базы данных
    ui: тесты в браузере
    dq: проверки качества данных Excel-отчётов
# ------------------------------------------------------------------------
# Предупреждения: тестовые HTTPS-сертификаты не засоряют вывод
# ------------------------------------------------------------------------
filterwarnings =
    # Клиенты с verify=False (тестовые HTTPS-сертификаты) не засоряют вывод.
    ignore::urllib3.exceptions.InsecureRequestWarning

# ------------------------------------------------------------------------
# Логи: консоль — INFO, файл — DEBUG; путь запуска задаёт корневой conftest.py
# ------------------------------------------------------------------------
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)s %(message)s
log_cli_date_format = %H:%M:%S
log_file_level = DEBUG
log_file_format = %(asctime)s %(levelname)s %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
